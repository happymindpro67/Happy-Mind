<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="inicioA.css">
</head>
<body>

  <div class="contenedor-dashboard">
    
    <!-- Menú Izquierdo (PsicoAgenda) -->
    <aside class="menu-izquierdo">
      <div class="encabezado-logo">
        <img src="logo.jpg" alt="Logo" width="40" height="40" class="icono-logo">
        <h2 class="texto-verde titulo-logo">PsicoAgenda</h2>
      </div>

      <nav class="navegacion-principal">
        <a href="#" class="enlace-nav efecto-enlace">
          <span class="icono-nav">🏠</span> Inicio
        </a>
        <a href="#" class="enlace-nav activo efecto-enlace">
          <span class="icono-nav">📅</span> Citas
        </a>
        <a href="#" class="enlace-nav efecto-enlace">
          <span class="icono-nav">👥</span> Pacientes
        </a>
        <a href="#" class="enlace-nav efecto-enlace">
          <span class="icono-nav">👤</span> Psicólogos
        </a>
      </nav>
    </aside>

    <!-- Contenido Central -->
    <main class="contenido-central">
      <h3 class="titulo-seccion">SUMMARY</h3>
      
      <div class="contenedor-botones">
        <button class="boton boton-primario efecto-boton">Create New Offer</button>
        <button class="boton boton-oscuro efecto-boton">Create Re-instatement</button>
      </div>

      <div class="cuadricula-tarjetas">
        <div class="tarjeta efecto-tarjeta">
          <h2 class="numero-grande">10</h2>
          <p class="texto-pequeno">Offers to Review</p>
        </div>
        
        <div class="tarjeta fondo-degradado efecto-brillo">
          <h2 class="numero-grande texto-blanco">03</h2>
          <p class="texto-pequeno texto-blanco translucido">Pending Reviews</p>
        </div>

        <div class="tarjeta efecto-tarjeta texto-advertencia">
          <h2 class="numero-grande">06</h2>
          <p class="texto-pequeno">Pending Checks</p>
        </div>
      </div>

      <div class="tarjeta grafico-principal efecto-tarjeta">
        <p class="texto-pequeno">AUDIT CHART</p>
        <div class="espacio-grafico">
          <span>[ Espacio para el Canvas del Gráfico ]</span>
        </div>
      </div>
    </main>

    <!-- Panel Derecho -->
    <aside class="menu-derecho">
      <div class="perfil-usuario">
        <span class="nombre-usuario">James Smith</span>
        <img src="https://via.placeholder.com/40" alt="Usuario" class="foto-perfil">
      </div>

      <p class="texto-pequeno">DEAL NUMBER</p>
      <h2 class="numero-deal">D189810</h2>

      <div class="detalles-deal">
        <div class="columna-detalle">
          <p class="texto-pequeno">Deal Name</p>
          <p class="texto-azul">Dummy deal</p>
        </div>
      </div>

      <div class="detalles-deal dos-columnas">
        <div class="columna-detalle">
          <p class="texto-pequeno">Home State</p>
          <p class="texto-azul">New Jersey</p>
        </div>
        <div class="columna-detalle">
          <p class="texto-pequeno">Domicile</p>
          <p class="texto-azul">United States</p>
        </div>
      </div>
    </aside>

  </div>

</body>
</html>
