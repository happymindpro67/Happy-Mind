<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-bg text-light vh-100">

  <div class="container-fluid h-100">
    <div class="row h-100">
      
      <!-- Barra Lateral Izquierda (Menú de Navegación) -->
      <aside class="col-xl-2 col-lg-3 py-4 d-flex flex-column sidebar-panel">
        <h4 class="text-primary fw-bold mb-4 px-3">DASHBOARD</h4>
        
        <p class="text-muted small px-3 mb-2">Main</p>
        <nav class="nav flex-column gap-2 px-2">
          <a class="nav-link active rounded d-flex align-items-center" href="#">
            <span class="me-2">⊞</span> Dashboard
          </a>
          <a class="nav-link text-light d-flex align-items-center nav-item-transition" href="#">
            <span class="me-2">📄</span> Contracts
          </a>
          <a class="nav-link text-light d-flex align-items-center nav-item-transition" href="#">
            <span class="me-2">☑</span> Checklist
          </a>
        </nav>
      </aside>

      <!-- Área Central (Tarjetas y Gráficos) -->
      <main class="col-xl-7 col-lg-6 py-4 px-4 d-flex flex-column">
        <h5 class="mb-4 text-muted uppercase">Summary</h5>
        
        <!-- Botones Superiores -->
        <div class="d-flex gap-3 mb-4">
          <button class="btn btn-primary rounded-pill px-4 btn-animated">Create New Offer</button>
          <button class="btn btn-dark-custom rounded-pill px-4 btn-animated">Create Re-instatement</button>
        </div>

        <!-- Tarjetas de Indicadores (KPIs) -->
        <div class="row g-4 mb-4">
          <!-- Tarjeta 1 -->
          <div class="col-md-4">
            <div class="card bg-panel border-0 p-3 h-100 card-animated">
              <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <h2 class="display-5 fw-bold mb-0">10</h2>
                <p class="text-muted small mt-2">Offers to Review</p>
              </div>
            </div>
          </div>
          
          <!-- Tarjeta 2 (Destacada) -->
          <div class="col-md-4">
            <div class="card bg-primary-gradient border-0 p-3 h-100 card-animated-glow">
              <div class="card-body d-flex flex-column justify-content-center align-items-center">
                <h2 class="display-5 fw-bold mb-0">03</h2>
                <p class="text-light small mt-2 opacity-75">Pending Reviews</p>
              </div>
            </div>
          </div>

          <!-- Tarjeta 3 -->
          <div class="col-md-4">
            <div class="card bg-panel border-0 p-3 h-100 card-animated">
              <div class="card-body d-flex flex-column justify-content-center align-items-center text-warning">
                <h2 class="display-5 fw-bold mb-0">06</h2>
                <p class="text-muted small mt-2">Pending Checks</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Contenedor del Gráfico Principal -->
        <div class="card bg-panel border-0 flex-grow-1 card-animated">
          <div class="card-body">
            <p class="text-muted small mb-3">AUDIT CHART</p>
            <!-- Aquí iría el canvas de Chart.js -->
            <div class="w-100 h-100 d-flex justify-content-center align-items-center border border-secondary border-opacity-25 rounded" style="min-height: 200px;">
              <span class="text-muted">[ Espacio para el Canvas del Gráfico ]</span>
            </div>
          </div>
        </div>
      </main>

      <!-- Panel Derecho (Detalles y Perfil) -->
      <aside class="col-xl-3 col-lg-3 py-4 bg-panel-darker px-4 shadow-lg">
        <div class="d-flex justify-content-end align-items-center mb-5">
          <span class="me-3 small">James Smith</span>
          <img src="https://via.placeholder.com/40" class="rounded-circle" alt="User">
        </div>

        <p class="text-muted small mb-1">DEAL NUMBER</p>
        <h3 class="fw-bold mb-4">D189810</h3>

        <div class="row g-3 mb-4">
          <div class="col-6">
            <p class="text-muted small mb-1">Deal Name</p>
            <p class="text-primary small">Dummy deal</p>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-6">
            <p class="text-muted small mb-1">Home State</p>
            <p class="text-primary small">New Jersey</p>
          </div>
          <div class="col-6">
            <p class="text-muted small mb-1">Domicile</p>
            <p class="text-primary small">United States</p>
          </div>
        </div>
      </aside>

    </div>
  </div>

</body>
</html>
